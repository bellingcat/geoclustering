[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geoclustering"
version = "0.4.1"
description = "📍 command-line tool for clustering geolocations."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Bellingcat", email = "tech@bellingcat.com" },
]
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
]
keywords = ["cluster", "gis", "pattern-analysis"]
dependencies = [
  "click",
  "geojson",
  "numpy",
  "pandas",
  "scikit-learn",
]

[project.optional-dependencies]
full = ["keplergl==0.4.0rc4"]

[dependency-groups]
dev = [
  "prek",
  "pytest",
  "ruff",
]


[project.scripts]
geoclustering = "geoclustering.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["geoclustering"]

[tool.ruff]
target-version = "py314"
